# 기본 검사 — 비밀 값 커밋 탐지 (gitleaks, 전체 이력)
# 저장소 루트의 .gitleaks.toml / .gitleaksignore가 있으면 자동으로 적용된다.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 이력 검사
      - name: gitleaks
        env:
          VER: "8.30.1"
        run: |
          set -eu
          f="gitleaks_${VER}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -sSfLO "$base/$f"
          curl -sSfL "$base/gitleaks_${VER}_checksums.txt" | grep " $f\$" | sha256sum -c -
          tar xzf "$f" gitleaks
          ./gitleaks git . --redact --no-banner -v
