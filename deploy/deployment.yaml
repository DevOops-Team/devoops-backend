apiVersion: apps/v1
kind: Deployment
metadata:
  name: vdi-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vdi-api
  template:
    metadata:
      labels:
        app: vdi-api
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: vdi-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vdi-config
            - secretRef:
                name: vdi-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vdi-api
spec:
  selector:
    app: vdi-api
  ports:
    - port: 80
      targetPort: 8080
