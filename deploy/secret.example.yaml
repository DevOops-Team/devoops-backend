apiVersion: v1
kind: Secret
metadata:
  name: vdi-secret
type: Opaque
stringData:
  MONGO_URI: mongodb://replace-user:replace-password@mongo:27017/vdi?replicaSet=rs0&authSource=admin
  ADMIN_NAME: admin
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: secret
  OS_AUTH_URL: https://openstack.example.com:5000/v3
  OS_USERNAME: replace-user
  OS_PASSWORD: replace-password
  OS_PROJECT_ID: replace-project-uuid
  OS_USER_DOMAIN_NAME: Default
  OS_PROJECT_DOMAIN_NAME: Default
  GUAC_JSON_KEY: replace-with-32-hex-characters
  RDP_CREDENTIALS_JSON: >-
    {"UBUNTU":{"username":"replace","password":"replace"},
    "WINDOWS":{"username":"replace","password":"replace","domain":""},
    "ROCKY":{"username":"replace","password":"replace"},
    "DEBIAN":{"username":"replace","password":"replace"}}
